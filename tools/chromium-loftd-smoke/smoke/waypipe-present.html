<!doctype html>
<!--
  Pattern page for the --waypipe presenting run.

  Two jobs:
  1. Paint a colour the host can assert on. The compositor-side screenshot must
     contain PATTERN_RGB pixels or the guest's frame never arrived.
  2. Publish the WebGL renderer as the window title. waypipe's client logs window
     titles verbatim ("Processing request: xdg_toplevel#24.set_title("...")"),
     so the title lands in a HOST-side log and carries the venus renderer across
     the transport in the same artefact. That is why no strace or debugging port
     is needed to assert hardware acceleration.

  A <script> must be inside <body> (a head script runs before document.body
  exists), and document.title must be set after the WebGL probe so the title
  reflects the real renderer.
-->
<html>
<head><meta charset="utf-8"><title>waypipe-present</title></head>
<body style="margin:0;padding:0;background:#ff00ff">
<div style="color:#ffffff;font:40px sans-serif;padding:40px">WAYPIPE-PRESENT</div>
<script>
  var renderer = 'no-webgl';
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2') || c.getContext('webgl');
    if (gl) {
      var dbg = gl.getExtension('WEBGL_debug_renderer_info');
      renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    }
  } catch (e) {
    renderer = 'probe-error:' + e;
  }
  document.title = 'waypipe-venus:' + renderer;
</script>
</body>
</html>
