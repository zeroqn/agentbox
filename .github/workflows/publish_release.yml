name: Publish release binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
permissions:
  contents: write

concurrency:
  group: rolling-alpha-release
  cancel-in-progress: true

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Restore release sccache
        uses: actions/cache@v4
        with:
          path: /tmp/agentbox-ci-sccache-release
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-release-${{ hashFiles('Cargo.lock', 'flake.lock', 'nix/pins.nix') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-release-
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-

      - name: Prepare release sccache directory
        run: |
          mkdir -p /tmp/agentbox-ci-sccache-release
          chmod -R a+rwX /tmp/agentbox-ci-sccache-release

      - name: Build release binaries
        run: |
          set -euo pipefail

          sccache_sandbox_path="/nix/var/cache/sccache=/tmp/agentbox-ci-sccache-release"

          nix build --option extra-sandbox-paths "${sccache_sandbox_path}" .#agentbox-musl-ci-sccache -o result-agentbox-musl
          nix build --option extra-sandbox-paths "${sccache_sandbox_path}" .#loftd-ci-sccache -o result-loftd

      - name: Normalize release sccache permissions
        if: always()
        run: |
          if [ -d /tmp/agentbox-ci-sccache-release ]; then
            chmod -R a+rwX /tmp/agentbox-ci-sccache-release
          fi

      - name: Prepare and smoke-test release artifacts
        id: prep
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          sha_tag="sha-${short_sha}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_version="${GITHUB_REF_NAME}"
            agentbox_asset_name="agentbox-${release_version}-${arch}-unknown-linux-musl"
            loftd_asset_name="loftd-${release_version}-${arch}-unknown-linux-gnu"
          else
            release_version=""
            agentbox_asset_name="agentbox-${arch}-unknown-linux-musl"
            loftd_asset_name="loftd-${arch}-unknown-linux-gnu"
          fi

          if [[ "${loftd_asset_name}" == *-linux-flake-locked ]]; then
            echo "refusing legacy loftd flake-locked asset name: ${loftd_asset_name}" >&2
            exit 1
          fi

          mkdir -p dist
          install -m 0755 result-agentbox-musl/bin/agentbox "dist/${agentbox_asset_name}"

          raw_loftd_path="result-loftd/bin/loftd"
          test -x "${raw_loftd_path}"
          if [ "$(dd if="${raw_loftd_path}" bs=2 count=1 2>/dev/null)" = "#!" ]; then
            echo "refusing to publish loftd wrapper script as ${loftd_asset_name}" >&2
            exit 1
          fi
          if [ "$(dd if="${raw_loftd_path}" bs=4 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then
            echo "refusing to publish non-ELF loftd asset ${loftd_asset_name}" >&2
            exit 1
          fi
          readelf -h "${raw_loftd_path}" > /dev/null
          install -m 0755 "${raw_loftd_path}" "dist/${loftd_asset_name}"

          case "${arch}" in
            x86_64)
              neutral_loader="/lib64/ld-linux-x86-64.so.2"
              ;;
            aarch64)
              neutral_loader="/lib/ld-linux-aarch64.so.1"
              ;;
            *)
              echo "unsupported loftd release architecture for neutral loader: ${arch}" >&2
              exit 1
              ;;
          esac

          nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#patchelf -c \
            patchelf --set-interpreter "${neutral_loader}" --set-rpath "" "dist/${loftd_asset_name}"
          readelf -h "dist/${loftd_asset_name}" > /dev/null

          if LC_ALL=C grep -aEq '/nix/store/[0-9a-df-np-sv-z]{32}-' "dist/${loftd_asset_name}"; then
            echo "refusing to publish loftd asset ${loftd_asset_name}: neutral asset still contains concrete /nix/store/<hash>- references" >&2
            exit 1
          fi

          "dist/${agentbox_asset_name}" --help > /dev/null
          result-loftd/bin/loftd --help > /dev/null

          sha256sum "dist/${agentbox_asset_name}" > "dist/${agentbox_asset_name}.sha256"
          sha256sum "dist/${loftd_asset_name}" > "dist/${loftd_asset_name}.sha256"

          {
            echo "agentbox_asset_name=${agentbox_asset_name}"
            echo "agentbox_asset_path=dist/${agentbox_asset_name}"
            echo "agentbox_checksum_path=dist/${agentbox_asset_name}.sha256"
            echo "loftd_asset_name=${loftd_asset_name}"
            echo "loftd_asset_path=dist/${loftd_asset_name}"
            echo "loftd_checksum_path=dist/${loftd_asset_name}.sha256"
            echo "sha_tag=${sha_tag}"
            echo "release_version=${release_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        run: |
          set -euo pipefail

          revision_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            cat > release-notes.md <<EOF_NOTES
          Versioned release for ${GITHUB_REF_NAME}.

          - Revision: ${GITHUB_SHA}
          - Revision URL: ${revision_url}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - \`${{ steps.prep.outputs.agentbox_asset_name }}\`: portable static/musl agentbox CLI.
          - \`${{ steps.prep.outputs.loftd_asset_name }}\`: neutral dynamically linked loftd ELF packaging input. It is not a standalone portable binary; Nix packaging patches ordinary ELF runtime dependencies and wires libkrun/runtime-tool dependencies. Prefer \`nix build .#loftd\`, \`nix build .#loftd-prebuilt\` once pinned, or the published \`ghcr.io/<repo-owner>/loftd\` image for ordinary use.

          Versioned images (\`ghcr.io/<repo-owner>/agentbox:${GITHUB_REF_NAME}\`, \`ghcr.io/<repo-owner>/loftd:${GITHUB_REF_NAME}\`) are published by the image workflow on tag push.
          The matching \`${{ steps.prep.outputs.sha_tag }}\` prerelease is the revision-addressed binary set for this exact revision.
          EOF_NOTES
          else
            cat > release-notes.md <<EOF_NOTES
          Rolling alpha build from main.

          - Revision: ${GITHUB_SHA}
          - Revision URL: ${revision_url}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - \`${{ steps.prep.outputs.agentbox_asset_name }}\`: portable static/musl agentbox CLI.
          - \`${{ steps.prep.outputs.loftd_asset_name }}\`: neutral dynamically linked loftd ELF packaging input. It is not a standalone portable binary; Nix packaging patches ordinary ELF runtime dependencies and wires libkrun/runtime-tool dependencies. Prefer \`nix build .#loftd\`, \`nix build .#loftd-prebuilt\` once pinned, or the published \`ghcr.io/<repo-owner>/loftd\` image for ordinary use.

          The \`alpha\` prerelease is reused on every push to main.
          The matching \`${{ steps.prep.outputs.sha_tag }}\` prerelease is the revision-addressed binary set for this exact revision.
          EOF_NOTES
          fi

      - name: Create or update rolling alpha release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha \
              --title "alpha" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create alpha \
              --title "alpha" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Create versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prep.outputs.release_version }}
        run: |
          set -euo pipefail

          gh release create "${RELEASE_VERSION}" \
            --title "${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"

      - name: Create or update immutable sha release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          set -euo pipefail

          if gh release view "${SHA_TAG}" >/dev/null 2>&1; then
            gh release edit "${SHA_TAG}" \
              --title "${SHA_TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${SHA_TAG}" \
              --title "${SHA_TAG}" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi


      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTBOX_ASSET_PATH: ${{ steps.prep.outputs.agentbox_asset_path }}
          AGENTBOX_CHECKSUM_PATH: ${{ steps.prep.outputs.agentbox_checksum_path }}
          LOFTD_ASSET_PATH: ${{ steps.prep.outputs.loftd_asset_path }}
          LOFTD_CHECKSUM_PATH: ${{ steps.prep.outputs.loftd_checksum_path }}
          RELEASE_VERSION: ${{ steps.prep.outputs.release_version }}
          SHA_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            gh release upload alpha \
              "${AGENTBOX_ASSET_PATH}" \
              "${AGENTBOX_CHECKSUM_PATH}" \
              "${LOFTD_ASSET_PATH}" \
              "${LOFTD_CHECKSUM_PATH}" \
              --clobber
          else
            gh release upload "${RELEASE_VERSION}" \
              "${AGENTBOX_ASSET_PATH}" \
              "${AGENTBOX_CHECKSUM_PATH}" \
              "${LOFTD_ASSET_PATH}" \
              "${LOFTD_CHECKSUM_PATH}" \
              --clobber
          fi

          gh release upload "${SHA_TAG}" \
            "${AGENTBOX_ASSET_PATH}" \
            "${AGENTBOX_CHECKSUM_PATH}" \
            "${LOFTD_ASSET_PATH}" \
            "${LOFTD_CHECKSUM_PATH}" \
            --clobber

      - name: Prune old sha releases
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          set -euo pipefail

          mapfile -t stale_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" |
              jq -sr '
                add
                | map(select(.tag_name | startswith("sha-")))
                | sort_by(.published_at // .created_at)
                | reverse
                | .[20:]
                | .[].tag_name
              '
          )

          for tag in "${stale_tags[@]}"; do
            if [ -n "${tag}" ] && [ "${tag}" != "${SHA_TAG}" ]; then
              gh release delete "${tag}" --cleanup-tag -y
            fi
          done
