name: Publish rolling and sha release binaries

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rolling-alpha-release
  cancel-in-progress: true

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build release binaries
        run: |
          set -euo pipefail

          nix build .#agentbox-musl -o result-agentbox-musl
          nix build .#loftd -o result-loftd

      - name: Prepare and smoke-test release artifacts
        id: prep
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          agentbox_asset_name="agentbox-${arch}-unknown-linux-musl"
          loftd_asset_name="loftd-${arch}-linux-flake-locked"
          release_tag="sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"

          mkdir -p dist
          install -m 0755 result-agentbox-musl/bin/agentbox "dist/${agentbox_asset_name}"

          raw_loftd_path="result-loftd/bin/.loftd-wrapped"
          test -x "${raw_loftd_path}"
          if [ "$(dd if="${raw_loftd_path}" bs=2 count=1 2>/dev/null)" = "#!" ]; then
            echo "refusing to publish loftd wrapper script as ${loftd_asset_name}" >&2
            exit 1
          fi
          if [ "$(dd if="${raw_loftd_path}" bs=4 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then
            echo "refusing to publish non-ELF loftd asset ${loftd_asset_name}" >&2
            exit 1
          fi
          readelf -h "${raw_loftd_path}" > /dev/null
          install -m 0755 "${raw_loftd_path}" "dist/${loftd_asset_name}"

          "dist/${agentbox_asset_name}" --help > /dev/null
          result-loftd/bin/loftd --help > /dev/null

          sha256sum "dist/${agentbox_asset_name}" > "dist/${agentbox_asset_name}.sha256"
          sha256sum "dist/${loftd_asset_name}" > "dist/${loftd_asset_name}.sha256"

          {
            echo "agentbox_asset_name=${agentbox_asset_name}"
            echo "agentbox_asset_path=dist/${agentbox_asset_name}"
            echo "agentbox_checksum_path=dist/${agentbox_asset_name}.sha256"
            echo "loftd_asset_name=${loftd_asset_name}"
            echo "loftd_asset_path=dist/${loftd_asset_name}"
            echo "loftd_checksum_path=dist/${loftd_asset_name}.sha256"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        run: |
          set -euo pipefail

          revision_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          cat > release-notes.md <<EOF_NOTES
          Rolling alpha build from main.

          - Revision: ${GITHUB_SHA}
          - Revision URL: ${revision_url}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - \`${{ steps.prep.outputs.agentbox_asset_name }}\`: portable static/musl agentbox CLI.
          - \`${{ steps.prep.outputs.loftd_asset_name }}\`: raw dynamically linked, flake-locked loftd ELF. It is not a standalone portable binary and may rely on the exact Nix store closure produced by this repository's flake lock. Prefer \`nix build .#loftd\`, \`nix build .#loftd-prebuilt\` once pinned, or the published \`ghcr.io/<repo-owner>/loftd\` image for ordinary use.

          The \`alpha\` prerelease is reused on every push to main.
          The matching \`${{ steps.prep.outputs.release_tag }}\` prerelease is the revision-addressed binary set for this exact revision.
          EOF_NOTES

      - name: Create or update rolling alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha \
              --title "alpha" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create alpha \
              --title "alpha" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Create or update immutable sha release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTBOX_ASSET_PATH: ${{ steps.prep.outputs.agentbox_asset_path }}
          AGENTBOX_CHECKSUM_PATH: ${{ steps.prep.outputs.agentbox_checksum_path }}
          LOFTD_ASSET_PATH: ${{ steps.prep.outputs.loftd_asset_path }}
          LOFTD_CHECKSUM_PATH: ${{ steps.prep.outputs.loftd_checksum_path }}
          RELEASE_TAG: ${{ steps.prep.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release upload alpha \
            "${AGENTBOX_ASSET_PATH}" \
            "${AGENTBOX_CHECKSUM_PATH}" \
            "${LOFTD_ASSET_PATH}" \
            "${LOFTD_CHECKSUM_PATH}" \
            --clobber

          gh release upload "${RELEASE_TAG}" \
            "${AGENTBOX_ASSET_PATH}" \
            "${AGENTBOX_CHECKSUM_PATH}" \
            "${LOFTD_ASSET_PATH}" \
            "${LOFTD_CHECKSUM_PATH}" \
            --clobber

      - name: Prune old sha releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prep.outputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -t stale_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" |
              jq -sr '
                add
                | map(select(.tag_name | startswith("sha-")))
                | sort_by(.published_at // .created_at)
                | reverse
                | .[20:]
                | .[].tag_name
              '
          )

          for tag in "${stale_tags[@]}"; do
            if [ -n "${tag}" ] && [ "${tag}" != "${RELEASE_TAG}" ]; then
              gh release delete "${tag}" --cleanup-tag -y
            fi
          done
