name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run tests
        run: |
          nix develop --command cargo test \
            --package loftd \
            --package loftd-guest-init \
            --package loftd-attach-protocol \
            --package loftd-exec-protocol \
            --package loftd-repository-tests
