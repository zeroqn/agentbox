name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run tests
        run: |
          nix develop --command cargo test \
            --package cang \
            --package cang-guest-init \
            --package cang-attach-protocol \
            --package cang-exec-protocol \
            --package cang-repository-tests
