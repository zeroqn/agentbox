name: Publish separate agentbox and loftd Dev Images

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build agentbox container archive
        run: nix build .#agentbox-container -o result-agentbox-container --print-out-paths > agentbox-container-path.txt
      - name: Build loftd container archive
        run: nix build .#container -o result-loftd-container --print-out-paths > loftd-container-path.txt
      - name: Free runner disk before loading images
        run: |
          df -h
          nix-collect-garbage -d
          docker system prune -af || true
          df -h
      - name: Load agentbox container archive
        run: docker load --input "$(cat agentbox-container-path.txt)"
      - name: Load loftd container archive
        run: docker load --input "$(cat loftd-container-path.txt)"
      - name: Verify separate guest init payloads in images
        run: |
          set -euo pipefail

          docker image inspect localhost/agentbox:latest > /dev/null
          docker run --rm --entrypoint /bin/agentbox-guest-init localhost/agentbox:latest --help > /dev/null

          docker image inspect localhost/loftd:latest > /dev/null
          docker run --rm --entrypoint /bin/loftd-guest-init localhost/loftd:latest --help > /dev/null
      - name: Compute image tags
        id: image_meta
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"

          {
            echo "loftd_image=ghcr.io/${owner}/loftd"
            echo "agentbox_image=ghcr.io/${owner}/agentbox"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "tag1=dev"
            echo "tag2=sha-${short_sha}"
          } >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag images for GHCR
        run: |
          set -euo pipefail

          docker tag localhost/agentbox:latest "${{ steps.image_meta.outputs.agentbox_image }}:${{ steps.image_meta.outputs.tag1 }}"
          docker tag localhost/agentbox:latest "${{ steps.image_meta.outputs.agentbox_image }}:${{ steps.image_meta.outputs.tag2 }}"

          docker tag localhost/loftd:latest "${{ steps.image_meta.outputs.loftd_image }}:${{ steps.image_meta.outputs.tag1 }}"
          docker tag localhost/loftd:latest "${{ steps.image_meta.outputs.loftd_image }}:${{ steps.image_meta.outputs.tag2 }}"
      - name: Push images to GHCR
        run: |
          set -euo pipefail

          for target_image in \
            "${{ steps.image_meta.outputs.agentbox_image }}" \
            "${{ steps.image_meta.outputs.loftd_image }}"
          do
            docker push "${target_image}:${{ steps.image_meta.outputs.tag1 }}"
            docker push "${target_image}:${{ steps.image_meta.outputs.tag2 }}"
          done
