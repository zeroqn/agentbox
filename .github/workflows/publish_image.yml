name: Publish shared loftd Image

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build loftd container archive
        run: nix build .#container --print-out-paths > container-path.txt
      - name: Free runner disk before loading image
        run: |
          df -h
          nix-collect-garbage -d
          docker system prune -af || true
          df -h
      - name: Load container archive
        run: docker load --input "$(cat container-path.txt)"
      - name: Verify shared guest init payloads in image
        run: |
          set -euo pipefail

          docker image inspect localhost/loftd:latest > /dev/null
          docker run --rm --entrypoint /bin/loftd-guest-init localhost/loftd:latest --help > /dev/null
          docker run --rm --entrypoint /bin/agentbox-guest-init localhost/loftd:latest --help > /dev/null
      - name: Compute image tags
        id: image_meta
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"

          {
            echo "loftd_image=ghcr.io/${owner}/loftd"
            echo "agentbox_image=ghcr.io/${owner}/agentbox"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "tag1=${GITHUB_REF_NAME}"
              echo "tag2=sha-${short_sha}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tag1=latest"
              echo "tag2=sha-${short_sha}"
            } >> "${GITHUB_OUTPUT}"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag image for GHCR
        run: |
          set -euo pipefail

          source_image="localhost/loftd:latest"
          for target_image in \
            "${{ steps.image_meta.outputs.loftd_image }}" \
            "${{ steps.image_meta.outputs.agentbox_image }}"
          do
            docker tag "${source_image}" "${target_image}:${{ steps.image_meta.outputs.tag1 }}"
            docker tag "${source_image}" "${target_image}:${{ steps.image_meta.outputs.tag2 }}"
          done
      - name: Push images to GHCR
        run: |
          set -euo pipefail

          for target_image in \
            "${{ steps.image_meta.outputs.loftd_image }}" \
            "${{ steps.image_meta.outputs.agentbox_image }}"
          do
            docker push "${target_image}:${{ steps.image_meta.outputs.tag1 }}"
            docker push "${target_image}:${{ steps.image_meta.outputs.tag2 }}"
          done
