[workspace]
members = [
  "crates/agentbox-host",
  "crates/agentbox-guest-init",
  "crates/loftd",
  "crates/loftd-guest-init",
  "crates/loftd-attach-protocol",
]
default-members = [
  "crates/agentbox-host",
  "crates/agentbox-guest-init",
  "crates/loftd",
  "crates/loftd-guest-init",
  "crates/loftd-attach-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
loftd-attach-protocol = { path = "crates/loftd-attach-protocol" }
tempfile = "3.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
vt100 = "0.16.2"

[profile.release]
lto = "thin"
