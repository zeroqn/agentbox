[workspace]
members = [
  "crates/agentbox-host",
  "crates/agentbox-guest-init",
  "crates/loftd",
  "crates/loftd-guest-init",
]
default-members = [
  "crates/agentbox-host",
  "crates/agentbox-guest-init",
  "crates/loftd",
  "crates/loftd-guest-init",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
tempfile = "3.23"

[profile.release]
lto = "thin"
